<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Pijama — Elim Pijamas</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/agregar_pijama.css}">
</head>
<body class="auth-body">

<aside class="sidebar">
    <div>
        <div class="brand">
            <h2>Elim</h2>
            <small>Pijamas</small>
        </div>
        <p class="nav-label">Principal</p>
        <ul class="nav-menu">
            <li>
                <a th:href="@{/admin/dashboard}">
                    <i class="fa-solid fa-gauge-high"></i> <span>Panel</span>
                </a>
            </li>
            <li>
                <a th:href="@{/admin/pijamas/agregar}" class="active">
                    <i class="fa-solid fa-plus"></i> <span>Agregar Pijama</span>
                </a>
            </li>
            <li>
                <a th:href="@{/admin/pedidos}">
                    <i class="fa-solid fa-truck-fast"></i> <span>Pedidos</span>
                </a>
            </li>
            <li>
                <a th:href="@{/admin/envios}">
                    <i class="fa-solid fa-shipping-fast"></i> <span>Envíos</span>
                </a>
            </li>
            <li>
                <a th:href="@{/admin/usuarios}">
                    <i class="fa-solid fa-user-group"></i> <span>Clientes</span>
                </a>
            </li>
        </ul>
    </div>
    <div class="logout-section">
        <a th:href="@{/logout}">
            <i class="fa-solid fa-right-from-bracket"></i> <span>Cerrar sesión</span>
        </a>
    </div>
</aside>

<div class="dashboard-container">
    <main class="auth-main" style="padding: 0;">
        <div class="auth-card">
            <h1>Agregar pijama</h1>
            <p class="subtitulo">Registra un nuevo producto en el catálogo de Elim Pijamas.</p>

            <div class="alerta error" th:if="${param.error != null}" th:text="${param.error}">Error al guardar</div>
            <div class="alerta" style="color:#2f6b4f; background:#eefbee; border-color:#2f6b4f;" th:if="${param.exito != null}" th:text="${param.exito}">Éxito al guardar</div>

            <form th:action="@{/admin/pijamas/guardar}" method="POST" enctype="multipart/form-data" class="auth-form">
                <div class="campo">
                    <label for="nombre_producto">Nombre del producto</label>
                    <input type="text" id="nombre_producto" name="nombreProducto" required>
                </div>

                <div class="campo">
                    <label for="descripcion">Descripción</label>
                    <input type="text" id="descripcion" name="descripcion">
                </div>

                <div class="campo">
                    <label for="precio">Precio</label>
                    <input type="number" id="precio" name="precio" step="0.01" min="0" required>
                </div>

                <div class="campo">
                    <label for="stock">Stock</label>
                    <input type="number" id="stock" name="stock" min="0" required>
                </div>

                <div class="campo">
                    <label for="imagen">Imagen del producto</label>
                    <input type="file" id="imagen" name="imagen" accept="image/png,image/jpeg,image/jpg,image/webp,image/gif">
                </div>

                <div class="campo">
                    <label for="id_categoria_fk">Categoría</label>
                    <select id="id_categoria_fk" name="idCategoria" required>
                        <option value="">Seleccione...</option>
                        <option th:each="cat : ${categorias}" th:value="${cat.idCategoria}" th:text="${cat.nombreCategoria}"></option>
                    </select>
                </div>

                <div class="campo">
                    <label for="estado">Estado</label>
                    <select id="estado" name="estado">
                        <option value="Disponible">Disponible</option>
                        <option value="Agotado">Agotado</option>
                    </select>
                </div>

                <button type="submit" class="btn-auth">
                    <i class="fa-solid fa-plus"></i> Guardar producto
                </button>
            </form>
        </div>
    </main>
</div>

</body>
</html>
